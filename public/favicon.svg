<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
	<title>Oncoming fist with medium-light skin tone breaking through glass</title>
	<defs>
		<linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="white" stop-opacity="0.25" />
			<stop offset="30%" stop-color="white" stop-opacity="0" />
			<stop offset="70%" stop-color="white" stop-opacity="0" />
			<stop offset="100%" stop-color="white" stop-opacity="0.125" />
		</linearGradient>
	</defs>

	<path
		fill="#1c2229"
		stroke="url(#highlight)"
		d="
			M 64 0.5
			C 8.5 0.5, 0.5 8.5, 0.5 64
			C 0.5 119.5, 8.5 127.5, 64 127.5
			C 119.5 127.5, 127.5 119.5, 127.5 64
			C 127.5 8.5, 119.5 0.5, 64 0.5
			Z
		"
	/>

	<text
		x="64"
		y="60"
		font-size="100"
		fill="DeepSkyBlue"
		text-anchor="middle"
		dominant-baseline="central"
	>
		⊹
	</text>
</svg>
